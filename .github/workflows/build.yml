name: Build Madar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Download web files from live app
        run: |
          mkdir -p www
          wget -q -O www/index.html https://madar-sys.ai.studio/
          mkdir -p www/assets
          wget -q -O www/assets/icon.svg https://madar-sys.ai.studio/assets/icon.svg || true
          wget -q -O www/assets/icon-192.png https://madar-sys.ai.studio/assets/icon-192.png || true
          wget -q -O www/assets/icon-512.png https://madar-sys.ai.studio/assets/icon-512.png || true
          wget -q -O www/manifest.json https://madar-sys.ai.studio/manifest.json || true
          wget -q -O www/service-worker.js https://madar-sys.ai.studio/service-worker.js || true
          # نسخ الآلة الحاسبة كصفحة البداية
          cp calculator.html www/calculator.html
          echo "index.html size:"
          wc -c www/index.html
          echo "calculator.html size:"
          wc -c www/calculator.html

      - name: Prepare icon and splash from calculator design
        run: |
          mkdir -p assets
          # توليد أيقونة آلة حاسبة زرقاء
          convert -size 1024x1024 xc:"#2563eb" \
            -fill white -stroke white -strokewidth 8 -draw "roundrectangle 250,280 774,744 40,40" \
            -fill "#2563eb" -stroke none \
            -draw "circle 380,440 380,420" \
            -draw "circle 512,440 512,420" \
            -draw "circle 644,440 644,420" \
            -draw "circle 380,560 380,540" \
            -draw "circle 512,560 512,540" \
            -draw "circle 644,560 644,540" \
            -draw "circle 380,680 380,660" \
            -draw "circle 512,680 512,660" \
            -draw "circle 644,680 644,660" \
            assets/icon.png
          # شاشة بداية زرقاء مع أيقونة الآلة الحاسبة
          convert -size 2732x2732 xc:"#1e3a5f" \( assets/icon.png -resize 900x900 \) -gravity center -composite assets/splash.png
          ls -la assets/

      - name: Setup package.json
        run: |
          cat > package.json << 'EOF'
          {
            "name": "calculator",
            "version": "1.0.0",
            "private": true
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install @capacitor/share@6 @capacitor/filesystem@6
          npm install --save-dev @capacitor/assets@3

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.calculator.simple",
            "appName": "Calculator",
            "webDir": "www",
            "android": {
              "allowMixedContent": true,
              "webContentsDebuggingEnabled": false
            },
            "server": {
              "androidScheme": "https"
            },
            "plugins": {
              "Share": {
                "androidScheme": "content"
              },
              "Filesystem": {
                "androidScheme": "content"
              }
            }
          }
          EOF

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure startup URL to calculator
        run: |
          # تغيير صفحة البداية من index.html إلى calculator.html
          find android -name "MainActivity.java" -exec sed -i 's|"https://localhost/index.html"|"https://localhost/calculator.html"|g' {} \;
          find android -name "MainActivity.java" -exec sed -i 's|"https://localhost"|"https://localhost/calculator.html"|g' {} \;

      - name: Generate app icons and splash screen
        run: npx capacitor-assets generate --android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
