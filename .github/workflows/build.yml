name: Build Madar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download web files from live app
        run: |
          mkdir -p www
          wget -q -O www/index.html https://madar-sys.ai.studio/
          mkdir -p www/assets
          wget -q -O www/assets/icon.svg https://madar-sys.ai.studio/assets/icon.svg || true
          wget -q -O www/assets/icon-192.png https://madar-sys.ai.studio/assets/icon-192.png || true
          wget -q -O www/assets/icon-512.png https://madar-sys.ai.studio/assets/icon-512.png || true
          wget -q -O www/manifest.json https://madar-sys.ai.studio/manifest.json || true
          wget -q -O www/service-worker.js https://madar-sys.ai.studio/service-worker.js || true
          echo "Downloaded files:"
          ls -la www/
          ls -la www/assets/ 2>/dev/null || true
          echo "index.html size:"
          wc -c www/index.html

      - name: Setup package.json
        run: |
          cat > package.json << 'EOF'
          {
            "name": "madar",
            "version": "1.0.0",
            "private": true
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Create Capacitor config (LOCAL files, offline-first)
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "ai.studio.madar_sys",
            "appName": "مدار",
            "webDir": "www",
            "android": {
              "allowMixedContent": true,
              "webContentsDebuggingEnabled": false
            },
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: madar-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
