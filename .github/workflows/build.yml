name: Build Madar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick librsvg2-bin

      - name: Download web files from live app
        run: |
          mkdir -p www
          wget -q -O www/index.html https://madar-sys.ai.studio/
          mkdir -p www/assets
          wget -q -O www/assets/icon.svg https://madar-sys.ai.studio/assets/icon.svg || true
          wget -q -O www/assets/icon-192.png https://madar-sys.ai.studio/assets/icon-192.png || true
          wget -q -O www/assets/icon-512.png https://madar-sys.ai.studio/assets/icon-512.png || true
          wget -q -O www/manifest.json https://madar-sys.ai.studio/manifest.json || true
          wget -q -O www/service-worker.js https://madar-sys.ai.studio/service-worker.js || true
          echo "index.html size:"
          wc -c www/index.html
          ls -la www/assets/ 2>/dev/null || true

      - name: Prepare icon and splash assets
        run: |
          mkdir -p assets
          wget -q -O /tmp/icon-src.png https://madar-sys.ai.studio/assets/icon-512.png || cp www/assets/icon-512.png /tmp/icon-src.png
          # تكبير الأيقونة إلى 1024x1024
          convert /tmp/icon-src.png -resize 1024x1024 -background none -gravity center -extent 1024x1024 assets/icon.png
          # شاشة البداية: خلفية كحلية مع شعار مدار في الوسط
          convert -size 2732x2732 xc:"#1e3a5f" \( /tmp/icon-src.png -resize 800x800 \) -gravity center -composite assets/splash.png
          echo "Generated assets:"
          ls -la assets/
          file assets/icon.png assets/splash.png

      - name: Setup package.json
        run: |
          cat > package.json << 'EOF'
          {
            "name": "madar",
            "version": "1.0.0",
            "private": true
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install --save-dev @capacitor/assets@3

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "ai.studio.madar_sys",
            "appName": "مدار",
            "webDir": "www",
            "android": {
              "allowMixedContent": true,
              "webContentsDebuggingEnabled": false
            },
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate app icons and splash screen
        run: npx capacitor-assets generate --android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: madar-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
