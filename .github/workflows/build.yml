name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create keystore
        run: |
          mkdir -p twa
          cd twa
          keytool -genkeypair -v -keystore android.keystore \
            -alias madar -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass madar2026 -keypass madar2026 \
            -dname "CN=Madar, OU=Madar, O=Madar, L=Aden, ST=Aden, C=YE"

      - name: Init Bubblewrap project
        run: |
          cd twa
          bubblewrap init --manifest https://madar-sys.ai.studio/manifest.json --directory . << 'EOF'
          madar2026
          madar2026
          madar
          EOF

      - name: Build APK
        run: |
          cd twa
          bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: madar-apk
          path: twa/*.apk
          retention-days: 30
