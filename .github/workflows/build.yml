name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: madar2026
      BUBBLEWRAP_KEY_PASSWORD: madar2026
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          rm cmdtools.zip
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create keystore
        run: |
          mkdir -p twa
          keytool -genkeypair -v -keystore twa/android.keystore \
            -alias madar -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass madar2026 -keypass madar2026 \
            -dname "CN=Madar, OU=Madar, O=Madar, L=Aden, ST=Aden, C=YE"

      - name: Create TWA manifest
        run: |
          cd twa
          cat > twa-manifest.json << 'JSONEOF'
          {
            "packageId": "ai.studio.madar_sys.twa",
            "host": "madar-sys.ai.studio",
            "name": "مدار",
            "launcherName": "مدار",
            "display": "standalone",
            "themeColor": "#1e3a5f",
            "navigationColor": "#1e3a5f",
            "navigationColorDark": "#1e3a5f",
            "backgroundColor": "#1e3a5f",
            "enableNotifications": false,
            "startUrl": "/",
            "iconUrl": "https://madar-sys.ai.studio/assets/icon-512.png",
            "maskableIconUrl": "https://madar-sys.ai.studio/assets/icon-512.png",
            "webManifestUrl": "https://madar-sys.ai.studio/manifest.json",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "minSdkVersion": 21,
            "orientation": "portrait",
            "fallbackType": "customtabs",
            "features": {},
            "shortcuts": [],
            "signingKey": {
              "path": "./android.keystore",
              "alias": "madar"
            }
          }
          JSONEOF

      - name: Configure Bubblewrap
        run: |
          mkdir -p $HOME/.bubblewrap
          cat > $HOME/.bubblewrap/config.json << JSONEOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$HOME/android-sdk"
          }
          JSONEOF

      - name: Build TWA
        run: |
          cd twa
          bubblewrap build --skipPwaValidation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: madar-apk
          path: twa/*.apk
          retention-days: 30
