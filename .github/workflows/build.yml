name: Build Madar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create web files
        run: |
          mkdir -p www
          cat > www/index.html << 'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"></head>
          <body style="margin:0"><p>Loading...</p></body></html>
          EOF

      - name: Setup package.json
        run: |
          cat > package.json << 'EOF'
          {
            "name": "madar",
            "version": "1.0.0",
            "private": true
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "ai.studio.madar_sys",
            "appName": "مدار",
            "webDir": "www",
            "server": {
              "url": "https://madar-sys.ai.studio",
              "androidScheme": "https",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: madar-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
