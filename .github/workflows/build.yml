name: Build Calculator APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Download Madar as madar.html
        run: |
          mkdir -p www
          mkdir -p www/assets
          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Mobile Safari/537.36"
          curl -fsSL --max-time 60 --retry 3 --retry-delay 5 -A "$UA" -o www/madar.html "https://madar-sys.ai.studio/" || { echo "FAILED madar.html"; exit 1; }
          curl -fsSL --max-time 30 -A "$UA" -o www/assets/icon.svg "https://madar-sys.ai.studio/assets/icon.svg" || true
          curl -fsSL --max-time 30 -A "$UA" -o www/assets/icon-192.png "https://madar-sys.ai.studio/assets/icon-192.png" || true
          curl -fsSL --max-time 30 -A "$UA" -o www/assets/icon-512.png "https://madar-sys.ai.studio/assets/icon-512.png" || true
          curl -fsSL --max-time 30 -A "$UA" -o www/manifest.json "https://madar-sys.ai.studio/manifest.json" || true
          curl -fsSL --max-time 30 -A "$UA" -o www/service-worker.js "https://madar-sys.ai.studio/service-worker.js" || true
          echo "=== Downloading local libraries for offline support ==="
          curl -fsSL --max-time 60 --retry 3 -A "$UA" -o www/lucide.min.js "https://madar-sys.ai.studio/lucide.min.js" || { echo "FAILED lucide"; exit 1; }
          curl -fsSL --max-time 60 --retry 3 -A "$UA" -o www/chart.umd.min.js "https://madar-sys.ai.studio/chart.umd.min.js" || { echo "FAILED chart"; exit 1; }
          curl -fsSL --max-time 60 --retry 3 -A "$UA" -o www/mammoth.browser.min.js "https://madar-sys.ai.studio/mammoth.browser.min.js" || true
          curl -fsSL --max-time 60 --retry 3 -A "$UA" -o www/xlsx.full.min.js "https://madar-sys.ai.studio/xlsx.full.min.js" || true
          curl -fsSL --max-time 60 --retry 3 -A "$UA" -o www/docx.umd.js "https://madar-sys.ai.studio/docx.umd.js" || true
          echo "=== Files in www/ ==="
          ls -la www/
          wc -c www/madar.html www/lucide.min.js www/chart.umd.min.js

      - name: Create calculator as index.html
        run: |
          cat > www/index.html << 'CALC_EOF'
          <!DOCTYPE html>
          <html lang="en" dir="ltr">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
          <title>Calculator</title>
          <style>
          * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
          html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
          body { background: #1a1a1a; display: flex; align-items: center; justify-content: center; }
          .calc { width: 100%; height: 100%; max-width: 480px; background: #1a1a1a; display: flex; flex-direction: column; }
          .display { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; padding: 20px 24px; min-height: 30vh; }
          .history { font-size: 18px; color: #666; min-height: 24px; margin-bottom: 8px; word-break: break-all; text-align: right; }
          .current { font-size: 64px; color: #fff; font-weight: 300; word-break: break-all; text-align: right; line-height: 1.1; }
          .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #333; padding: 1px; }
          button { height: 80px; border: none; font-size: 28px; font-weight: 400; cursor: pointer; background: #2c2c2c; color: #fff; transition: background 0.1s; }
          button:active { background: #3a3a3a; }
          button.op { background: #ff9500; color: #fff; font-weight: 500; }
          button.op:active { background: #cc7700; }
          button.fn { background: #505050; color: #fff; }
          button.fn:active { background: #6a6a6a; }
          button.zero { grid-column: span 2; }
          </style>
          </head>
          <body>
          <div class="calc">
            <div class="display">
              <div class="history" id="history"></div>
              <div class="current" id="current">0</div>
            </div>
            <div class="buttons">
              <button class="fn" onclick="clearAll()">AC</button>
              <button class="fn" onclick="toggleSign()">+/-</button>
              <button class="fn" onclick="percent()">%</button>
              <button class="op" onclick="op('/')">÷</button>
              <button onclick="num('7')">7</button>
              <button onclick="num('8')">8</button>
              <button onclick="num('9')">9</button>
              <button class="op" onclick="op('*')">×</button>
              <button onclick="num('4')">4</button>
              <button onclick="num('5')">5</button>
              <button onclick="num('6')">6</button>
              <button class="op" onclick="op('-')">−</button>
              <button onclick="num('1')">1</button>
              <button onclick="num('2')">2</button>
              <button onclick="num('3')">3</button>
              <button class="op" onclick="op('+')">+</button>
              <button class="zero" onclick="num('0')">0</button>
              <button onclick="num('.')">.</button>
              <button class="op" onclick="equals()">=</button>
            </div>
          </div>
          <script>
          let currentInput = '0';
          let previousValue = null;
          let pendingOp = null;
          let justEvaluated = false;
          const el = {
            current: document.getElementById('current'),
            history: document.getElementById('history')
          };
          function render() {
            el.current.textContent = currentInput;
            if (previousValue !== null && pendingOp) {
              el.history.textContent = previousValue + ' ' + symbol(pendingOp);
            } else {
              el.history.textContent = '';
            }
          }
          function symbol(op) {
            return { '+': '+', '-': '−', '*': '×', '/': '÷' }[op] || op;
          }
          function num(n) {
            if (justEvaluated) { currentInput = '0'; justEvaluated = false; }
            if (n === '.' && currentInput.includes('.')) return;
            if (currentInput === '0' && n !== '.') currentInput = n;
            else currentInput += n;
            render();
          }
          function op(o) {
            if (pendingOp && !justEvaluated) compute();
            previousValue = parseFloat(currentInput);
            pendingOp = o;
            currentInput = '0';
            justEvaluated = false;
            render();
          }
          function compute() {
            if (previousValue === null || !pendingOp) return;
            const a = previousValue;
            const b = parseFloat(currentInput);
            let result = 0;
            switch (pendingOp) {
              case '+': result = a + b; break;
              case '-': result = a - b; break;
              case '*': result = a * b; break;
              case '/': result = b === 0 ? 0 : a / b; break;
            }
            currentInput = String(parseFloat(result.toFixed(10)));
            previousValue = null;
            pendingOp = null;
          }
          async function equals() {
            compute();
            justEvaluated = true;
            el.history.textContent = '';
            render();
            await tryUnlock();
          }
          function clearAll() {
            currentInput = '0';
            previousValue = null;
            pendingOp = null;
            justEvaluated = false;
            render();
          }
          function toggleSign() {
            if (currentInput === '0') return;
            if (currentInput.startsWith('-')) currentInput = currentInput.slice(1);
            else currentInput = '-' + currentInput;
            render();
          }
          function percent() {
            currentInput = String(parseFloat(currentInput) / 100);
            render();
          }
          async function tryUnlock() {
            const code = currentInput.trim();
            if (!code || code.length < 3) return;

            const lockUntil = parseInt(localStorage.getItem('madar_lock_until') || '0', 10);
            const attempts = parseInt(localStorage.getItem('madar_lock_attempts') || '0', 10);

            if (Date.now() < lockUntil) {
              const remaining = Math.ceil((lockUntil - Date.now()) / 1000);
              const mins = Math.floor(remaining / 60);
              const secs = remaining % 60;
              const msg = mins > 0 ? (mins + ' د ' + secs + ' ث') : (secs + ' ث');
              alert('🔒 الكود مقفل. انتظر ' + msg);
              clearAll();
              return;
            }

            try {
              const res = await fetch('https://madar-sys.ai.studio/api/verify-unlock-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code })
              });
              const data = await res.json();

              if (data.valid) {
                localStorage.removeItem('madar_lock_attempts');
                localStorage.removeItem('madar_lock_until');
                localStorage.setItem('madar_last_code', code);
                window.location.href = 'madar.html';
              } else {
                const newAttempts = attempts + 1;
                localStorage.setItem('madar_lock_attempts', String(newAttempts));

                let lockMs = 0;
                if (newAttempts === 3) lockMs = 60 * 1000;
                else if (newAttempts === 5) lockMs = 5 * 60 * 1000;
                else if (newAttempts >= 10) lockMs = 30 * 60 * 1000;

                if (lockMs > 0) {
                  localStorage.setItem('madar_lock_until', String(Date.now() + lockMs));
                  alert('🔒 محاولات خاطئة كثيرة. الكود مقفل مؤقتاً.');
                } else {
                  alert('❌ الكود خطأ (' + newAttempts + '/3 قبل القفل)');
                }
                clearAll();
              }
            } catch (e) {
              const last = localStorage.getItem('madar_last_code');
              if (last && last === code) {
                window.location.href = 'madar.html';
              } else {
                alert('🔴 لا يوجد إنترنت');
              }
            }
          }
          render();
          </script>
          </body>
          </html>
          CALC_EOF
          wc -c www/index.html

      - name: Prepare icon and splash from uploaded calculator icon
        run: |
          mkdir -p assets
          convert calculator-icon.png -resize 1024x1024 -background white -gravity center -extent 1024x1024 assets/icon.png
          convert -size 2732x2732 xc:"#1e3a5f" \( assets/icon.png -resize 900x900 \) -gravity center -composite assets/splash.png
          ls -la assets/

      - name: Setup package.json
        run: |
          cat > package.json << 'EOF'
          {
            "name": "calculator",
            "version": "1.0.0",
            "private": true
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install @capacitor/share@6 @capacitor/filesystem@6
          npm install --save-dev @capacitor/assets@3

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.calculator.simple",
            "appName": "Calculator",
            "webDir": "www",
            "android": {
              "allowMixedContent": true,
              "webContentsDebuggingEnabled": false
            },
            "server": {
              "androidScheme": "https"
            },
            "plugins": {
              "Share": { "androidScheme": "content" },
              "Filesystem": { "androidScheme": "content" }
            }
          }
          EOF

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate app icons and splash screen
        run: npx capacitor-assets generate --android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
