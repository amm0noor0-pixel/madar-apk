name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore madar-release.keystore \
            -alias madar \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass MadarKeystore2026AdenYemenStrong \
            -keypass MadarKeystore2026AdenYemenStrong \
            -dname "CN=Madar App, OU=Mobile, O=Madar, L=Aden, ST=Aden, C=YE"

      - name: Verify keystore
        run: |
          keytool -list -v \
            -keystore madar-release.keystore \
            -storepass MadarKeystore2026AdenYemenStrong

      - name: Convert to base64
        run: |
          base64 -w 0 madar-release.keystore > madar-keystore-base64.txt
          echo "=== Base64 size: $(wc -c < madar-keystore-base64.txt) bytes ==="

      - name: Upload as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: madar-keystore-files
          path: |
            madar-release.keystore
            madar-keystore-base64.txt
          retention-days: 1
